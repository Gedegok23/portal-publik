services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal_publik
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_publik"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://portal:portal@db:5432/portal_publik?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
      DEFAULT_PAGE_SIZE: 9
      MAX_PAGE_SIZE: 100
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  portal_pgdata:
